name: stats-hunter

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stats_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stats_hunter_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stats_hunter}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - stats_hunter_pg:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stats_hunter} -d ${POSTGRES_DB:-stats_hunter}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stats-hunter

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - stats_hunter_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stats-hunter

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm --hostname=http://158.160.204.124:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-stats_hunter}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-stats_hunter_dev}
      JAVA_OPTS_APPEND: '-Xms256m -Xmx768m'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stats-hunter

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8081}:80'
    volumes:
      - ./dist/apps/frontend/browser:/usr/share/nginx/html:ro
      - ./infra/nginx/stats-hunter.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - stats-hunter

volumes:
  stats_hunter_pg:
  stats_hunter_redis:

networks:
  stats-hunter:
    name: stats-hunter
