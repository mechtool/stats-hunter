name: app-template

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_template_dev}
      POSTGRES_DB: ${POSTGRES_DB:-app_template}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - app_template_pg:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app_template} -d ${POSTGRES_DB:-app_template}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-template

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - app_template_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-template

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start --hostname=auth.example.com --proxy-headers=xforwarded --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-app_template}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-app_template_dev}
      JAVA_OPTS_APPEND: '-Xms256m -Xmx768m'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-template

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8081}:80'
    volumes:
      - ./dist/apps/frontend/browser:/usr/share/nginx/html:ro
      - ./infra/nginx/app-template.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - app-template

volumes:
  app_template_pg:
  app_template_redis:

networks:
  app-template:
    name: app-template
