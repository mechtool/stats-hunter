<div class="login-wrapper">
  <nz-card class="login-card">
    <div class="login-brand">
      <div class="login-logo">AT</div>
      <h1>App Template</h1>
      <p>Стартовый шаблон приложения</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label class="field-label required" for="email">Email</label>
        <div class="input-wrapper">
          <span
            class="field-icon"
            nz-icon
            nzType="mail"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
          <input
            id="email"
            nz-input
            type="email"
            formControlName="email"
            placeholder="Введите email"
            aria-label="Email"
          />
        </div>
        @if (emailError()) {
          <div class="form-error">{{ emailError() }}</div>
        }
      </div>

      <div class="form-field">
        <label class="field-label required" for="password">Пароль</label>
        <div class="input-wrapper password-field">
          <span
            class="field-icon"
            nz-icon
            nzType="lock"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
          <input
            id="password"
            nz-input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Введите пароль"
            aria-label="Пароль"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Скрыть пароль' : 'Показать пароль'"
            (click)="showPassword = !showPassword"
          >
            <span nz-icon [nzType]="showPassword ? 'eye-invisible' : 'eye'"></span>
          </button>
        </div>
        @if (passwordError()) {
          <div class="form-error">{{ passwordError() }}</div>
        }
      </div>

      <div class="forgot-link">
        <a routerLink="/forgot-password">Забыли пароль?</a>
      </div>

      <button
        nz-button
        nzType="primary"
        nzBlock
        nzSize="large"
        type="submit"
        [disabled]="form.invalid"
      >
        Войти
      </button>
    </form>

    <div class="login-note">
      Нет аккаунта?
      <a routerLink="/register">Зарегистрируйтесь</a>
    </div>
  </nz-card>
</div>
