<div class="login-wrapper">
  <nz-card class="login-card">
    <div class="login-brand">
      <div class="login-logo">SH</div>
      <h1>Stats Hunter</h1>
      <p>Аналитика и статистика маркетплейсов</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <input
          nz-input
          type="email"
          formControlName="email"
          placeholder="Email"
          aria-label="Email"
        />
        @if (emailError()) {
          <div class="form-error">{{ emailError() }}</div>
        }
      </div>

      <div class="form-field">
        <input
          nz-input
          type="password"
          formControlName="password"
          placeholder="Пароль"
          aria-label="Пароль"
        />
        @if (passwordError()) {
          <div class="form-error">{{ passwordError() }}</div>
        }
      </div>

      @if (loginError) {
        <div class="form-error">{{ loginError }}</div>
      }

      <button
        nz-button
        nzType="primary"
        nzBlock
        nzSize="large"
        type="submit"
        [disabled]="form.invalid"
      >
        Войти
      </button>
    </form>

    <div class="login-note">
      Нет аккаунта?
      <a routerLink="/register">Зарегистрируйтесь</a>
    </div>
  </nz-card>
</div>
