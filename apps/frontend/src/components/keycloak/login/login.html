<div class="login-wrapper">
  <nz-card class="login-card">
    <div class="login-brand">
      <div class="login-logo">SH</div>
      <h1>Stats Hunter</h1>
      <p>Аналитика и статистика маркетплейсов</p>
    </div>

    <div class="login-form">
      <input
        nz-input
        type="email"
        placeholder="Email"
        aria-label="Email"
        class="login-input"
      />
      <input
        nz-input
        type="password"
        placeholder="Пароль"
        aria-label="Пароль"
        class="login-input"
      />
      <button nz-button nzType="primary" nzBlock nzSize="large" disabled>
        Войти
      </button>
    </div>

    <div class="login-note">
      Вход и регистрация будут подключены через Keycloak после макетов Pixso.
    </div>
  </nz-card>
</div>
