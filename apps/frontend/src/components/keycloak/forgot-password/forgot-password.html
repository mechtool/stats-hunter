<div class="forgot-wrapper">
  <nz-card class="forgot-card">
    <div class="forgot-brand">
      <div class="forgot-logo">AT</div>
      <h1>Восстановление пароля</h1>
      <p>Укажите email — мы отправим ссылку для сброса пароля</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label class="field-label required" for="email">Email</label>
        <div class="input-wrapper">
          <span
            class="field-icon"
            nz-icon
            nzType="mail"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
          <input
            id="email"
            nz-input
            type="email"
            formControlName="email"
            placeholder="Введите email"
            aria-label="Email"
          />
        </div>
        @if (emailError()) {
          <div class="form-error">{{ emailError() }}</div>
        }
      </div>

      <button
        nz-button
        nzType="primary"
        nzBlock
        nzSize="large"
        type="submit"
        [disabled]="form.invalid || submitting"
      >
        Отправить ссылку
      </button>
    </form>

    <div class="forgot-note">
      Вспомнили пароль?
      <a routerLink="/login">Войти</a>
    </div>
  </nz-card>
</div>
