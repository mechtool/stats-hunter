<div class="register-wrapper">
  <nz-card class="register-card">
    <div class="register-brand">
      <div class="register-logo">SH</div>
      <h1>Регистрация</h1>
      <p>Создайте аккаунт Stats Hunter</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label class="field-label required" for="email">Email</label>
        <div class="input-wrapper">
          <span
            class="field-icon"
            nz-icon
            nzType="mail"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
          <input
            id="email"
            nz-input
            type="email"
            formControlName="email"
            placeholder="Введите email"
            aria-label="Email"
          />
        </div>
        @if (emailError()) {
          <div class="form-error">{{ emailError() }}</div>
        }
      </div>

      <div class="form-field">
        <label class="field-label required" for="password">Пароль</label>
        <div class="input-wrapper password-field">
          <span
            class="field-icon"
            nz-icon
            nzType="lock"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
          <input
            id="password"
            nz-input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Введите пароль"
            aria-label="Пароль"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Скрыть пароль' : 'Показать пароль'"
            (click)="showPassword = !showPassword"
          >
            <span nz-icon [nzType]="showPassword ? 'eye-invisible' : 'eye'"></span>
          </button>
        </div>
        @if (passwordError()) {
          <div class="form-error">{{ passwordError() }}</div>
        }
      </div>

      <div class="form-field">
        <label class="field-label required" for="confirmPassword">Повторите пароль</label>
        <div class="input-wrapper password-field">
          <span
            class="field-icon"
            nz-icon
            nzType="lock"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
          <input
            id="confirmPassword"
            nz-input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Повторите пароль"
            aria-label="Повторите пароль"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showConfirmPassword ? 'Скрыть пароль' : 'Показать пароль'"
            (click)="showConfirmPassword = !showConfirmPassword"
          >
            <span nz-icon [nzType]="showConfirmPassword ? 'eye-invisible' : 'eye'"></span>
          </button>
        </div>
        @if (confirmPasswordError()) {
          <div class="form-error">{{ confirmPasswordError() }}</div>
        }
      </div>

      <button
        nz-button
        nzType="primary"
        nzBlock
        nzSize="large"
        type="submit"
        [disabled]="form.invalid"
      >
        Зарегистрироваться
      </button>
    </form>

    <div class="register-note">
      Уже есть аккаунт?
      <a routerLink="/login">Войти</a>
    </div>
  </nz-card>
</div>
