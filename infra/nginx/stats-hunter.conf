# stats-hunter — nginx (test/prod). SSG-статика + прокси /api на бэкенд.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # API -> NestJS (работает на хосте, доступ через host-gateway)
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # service worker — не кэшировать
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # статика — долгий кэш
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp|webmanifest)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # корень -> CSR-оболочка (SSG-вывод хранит shell в index.csr.html)
    location = / {
        try_files /index.csr.html =404;
    }

    # пререндеренный маршрут или fallback на CSR
    location / {
        try_files $uri $uri/index.html /index.csr.html;
    }
}
